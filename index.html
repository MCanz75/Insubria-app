<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Insubria App</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#0A4EA1">
</head>
<body>
  <div class="header">
    <img src="icons/icon-192.png" alt="logo">
    <div>
      <h1>Insubria App</h1>
      <div class="small">Lions Club Varese Insubria</div>
    </div>
  </div>

  <div class="container">
    <!-- MEMBERS -->
    <div id="members" class="section">
      <div class="row" style="margin-bottom:8px">
        <h2>Membri</h2>
        <button class="btn" onclick="showSection('member-edit'); el('member-id').value=''; el('member-name').value=''; el('member-role').value=''; el('member-email').value='';">Aggiungi</button>
      </div>
      <div id="members-list"></div>
    </div>

    <!-- EVENTS -->
    <div id="events" class="section">
      <div class="row" style="margin-bottom:8px">
        <h2>Eventi</h2>
        <button class="btn" onclick="showSection('event-edit'); el('event-id').value=''; el('event-title').value=''; el('event-date').value=new Date().toISOString().slice(0,16); el('event-location').value=''; el('event-details').value='';">Nuovo</button>
      </div>
      <div id="events-list"></div>
    </div>

    <!-- POSTS / BACHECA -->
    <div id="posts" class="section">
      <h2>Bacheca</h2>
      <div id="posts-list"></div>
      <div class="card">
        <input id="post-author" class="input" placeholder="Tuo nome">
        <textarea id="post-text" placeholder="Scrivi un aggiornamento..."></textarea>
        <div class="actions"><button class="btn" onclick="publishPost()">Pubblica</button></div>
      </div>
    </div>

    <!-- CHAT -->
    <div id="chat" class="section">
      <h2>Chat soci</h2>
      <div id="chat-list" class="card" style="max-height:300px; overflow:auto;"></div>
      <input id="chat-name" class="input" placeholder="Tuo nome">
      <textarea id="chat-text" placeholder="Messaggio..."></textarea>
      <div class="actions"><button class="btn" onclick="sendChat()">Invia</button></div>
    </div>

    <!-- GALLERY -->
    <div id="gallery" class="section">
      <h2>Galleria</h2>
      <div class="card">
        <input type="file" accept="image/*" onchange="addGalleryFile(this)">
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <!-- DOCUMENTS -->
    <div id="documents" class="section">
      <h2>Documenti</h2>
      <div class="card">
        <input type="file" accept=".pdf,.doc,.docx" onchange="addDocFile(this)">
      </div>
      <div class="docs-list" id="docs-list"></div>
    </div>

    <!-- MEMBER EDIT -->
    <div id="member-edit" class="section">
      <h2>Dettaglio membro</h2>
      <input type="hidden" id="member-id">
      <div class="card">
        <input id="member-name" class="input" placeholder="Nome">
        <input id="member-role" class="input" placeholder="Ruolo" style="margin-top:8px">
        <input id="member-email" class="input" placeholder="Email" style="margin-top:8px">
        <div class="actions"><button class="btn" onclick="saveMember()">Salva</button><button class="btn secondary" onclick="showSection('members')">Annulla</button></div>
      </div>
    </div>

    <!-- EVENT EDIT -->
    <div id="event-edit" class="section">
      <h2>Dettaglio evento</h2>
      <input type="hidden" id="event-id">
      <div class="card">
        <input id="event-title" class="input" placeholder="Titolo">
        <input id="event-date" type="datetime-local" class="input" style="margin-top:8px">
        <input id="event-location" class="input" placeholder="Luogo" style="margin-top:8px">
        <textarea id="event-details" class="input" placeholder="Dettagli" style="margin-top:8px"></textarea>
        <h3>Partecipanti</h3>
        <div id="event-attendees"></div>
        <div class="actions"><button class="btn" onclick="saveEvent()">Salva</button><button class="btn secondary" onclick="showSection('events')">Annulla</button></div>
      </div>
    </div>

    <div class="footer-note">Insubria App — Lions Club Varese Insubria</div>
  </div>

  <div class="tabbar">
    <button data-tab="members">Membri</button>
    <button data-tab="events">Eventi</button>
    <button data-tab="posts">Bacheca</button>
    <button data-tab="chat">Chat</button>
    <button data-tab="gallery">Galleria</button>
    <button data-tab="documents">Documenti</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
